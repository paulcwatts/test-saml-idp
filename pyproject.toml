[project]
name = "test-saml-idp"
version = "0.1.0"
description = "A basic test SAML IdP implementation in Python"
authors = [
    {name = "Paul Watts", email = "paulcwatts@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}

dependencies = [
    "fastapi-csrf-protect>=1.0.7",
    "fastapi[standard]>=0.112.1",
    "jinja2>=3.1.4",
    "lxml>=5.3.0",
    "pydantic-settings>=2.4.0",
    "signxml>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.6.2",
    "ty>=0.0.90",
    "types-lxml>=2026.2.16",
]

[tool.uv]
exclude-newer-package = { certifi = false }

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "COM812",
    "CPY001",
    "D203",
    "D211",
    "D212",
    "D213",
    "PLR0913",
    "PLR0917",
    "TRY300"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D104", "S"]

[tool.ty.rules]
# Stricter than the defaults, roughly matching the previous pyright config
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-cast = "error"
redundant-condition = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["src"]
